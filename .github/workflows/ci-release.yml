name: Build Leafstrap for macOS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      SIGN_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CERT_P12_BASE64 != '' && secrets.CERT_P12_INSTALLER_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.DEVELOPER_ID_APP != '' && secrets.DEVELOPER_ID_INSTALLER != '' && secrets.APP_STORE_CONNECT_P8_CONTENT != '' && secrets.APPLE_KEY_ID != '' && secrets.APPLE_ISSUER_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Remove stale signing keychain
        if: env.SIGN_RELEASE == 'true'
        run: security delete-keychain signing_temp.keychain || true

      - name: Import application certificate
        id: import_app_cert
        if: env.SIGN_RELEASE == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Import installer certificate
        if: env.SIGN_RELEASE == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12_INSTALLER_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          create-keychain: false
          keychain-password: ${{ steps.import_app_cert.outputs.keychain-password }}

      - name: Build, optionally sign, and package
        env:
          SIGN: ${{ env.SIGN_RELEASE }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APP_STORE_CONNECT_P8_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: dotnet run --project build -- Publish --configuration Release

      - name: Name package for architecture
        run: mv .build/publish/Leafstrap.pkg .build/publish/Leafstrap-macos-${{ matrix.arch }}.pkg

      - name: Verify installer payload
        run: |
          package=".build/publish/Leafstrap-macos-${{ matrix.arch }}.pkg"
          pkgutil --payload-files "$package" | grep -q "Leafstrap.app/Contents/Info.plist"
          pkgutil --expand "$package" expanded-package
          grep -q 'version="1.0.3"' expanded-package/PackageInfo
          grep -q 'install-location="/Applications"' expanded-package/PackageInfo

      - uses: actions/upload-artifact@v7
        with:
          name: leafstrap-macos-${{ matrix.arch }}-${{ github.sha }}
          path: .build/publish/Leafstrap-macos-${{ matrix.arch }}.pkg

  release:
    name: Create draft release
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Apple Silicon package
        uses: actions/download-artifact@v7
        with:
          name: leafstrap-macos-arm64-${{ github.sha }}
          path: release

      - name: Download Intel package
        uses: actions/download-artifact@v7
        with:
          name: leafstrap-macos-x64-${{ github.sha }}
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Leafstrap ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/Leafstrap-macos-arm64.pkg
            release/Leafstrap-macos-x64.pkg
